name: BandFace
options:
  bundleIdPrefix: com.example
  developmentLanguage: uk
  deploymentTarget:
    iOS: "16.0"
packages:
  # Протокол пристрою: окрема бібліотека з ліцензією MIT (див. BandFaceKit/LICENSE)
  BandFaceKit:
    path: BandFaceKit
targets:
  BandFace:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Редактор циферблатів (той самий код, що й у тестовому застосунку FaceEditor)
      - path: FaceEditor/Editor
    dependencies:
      - package: BandFaceKit
      - package: BandFaceKit
        product: FaceCompiler
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BandFace
        # Якщо мова iPhone не українська й не російська — показуємо англійську
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [uk, en, ru]
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "Bluetooth потрібен, щоб знайти пристрій Xiaomi та встановити циферблат."
        UILaunchScreen: {}
        # Анімації на 120 Гц на iPhone з ProMotion (без цього — не більше 60 к/с)
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # MiSans (латиниця) — шрифт браслета для написів у редакторі. © Xiaomi, вбудовування дозволене
        UIAppFonts:
          - MiSans-Thin.ttf
          - MiSans-ExtraLight.ttf
          - MiSans-Light.ttf
          - MiSans-Normal.ttf
          - MiSans-Regular.ttf
          - MiSans-Medium.ttf
          - MiSans-Demibold.ttf
          - MiSans-Semibold.ttf
          - MiSans-Bold.ttf
          - MiSans-Heavy.ttf
        # Файли циферблатів (.bin, .face) відкриваються в BandFace з «Файлів», AirDrop і «Поділитися»
        CFBundleDocumentTypes:
          - CFBundleTypeName: Xiaomi watch face
            LSHandlerRank: Owner
            LSItemContentTypes: [app.bandface.watchface]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.bandface.watchface
            UTTypeDescription: Xiaomi watch face
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [bin, face]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bandface
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Менший застосунок: без символів налагодження й невикористаного коду, оптимізація під розмір
        Release:
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          COPY_PHASE_STRIP: YES
          SWIFT_OPTIMIZATION_LEVEL: -Osize
    scheme:
      testTargets:
        - EditorTests
        - BandFaceUITests

  # Прохід екранами BandFace зі знімками (магазин, превʼю, редактор) — для перевірки вигляду в CI
  BandFaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BandFace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bandface.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BandFace

  # Тестовий застосунок: редактор циферблатів (код редактора — FaceEditor/Editor, компілятор — FaceCompiler)
  FaceEditor:
    type: application
    platform: iOS
    sources:
      - path: FaceEditor
        excludes:
          - "Tests/**"
          - "UITests/**"
      - path: Sources/Theme.swift
      - path: Sources/Assets.xcassets
    dependencies:
      - package: BandFaceKit
        product: FaceCompiler
    info:
      path: FaceEditor/Info.plist
      properties:
        CFBundleDisplayName: "Редактор"
        CFBundleDevelopmentRegion: uk
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.faceeditor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Тести логіки редактора й компілятора. Хостом є BandFace (окремий застосунок FaceEditor не збирається)
  EditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FaceEditor/Tests
      - path: Sources/Faces
        buildPhase: resources
    dependencies:
      - target: BandFace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bandface.editortests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BandFace.app/BandFace"
        BUNDLE_LOADER: "$(TEST_HOST)"
