name: BandFace
options:
  bundleIdPrefix: com.example
  developmentLanguage: uk
  deploymentTarget:
    iOS: "16.0"
packages:
  # Протокол пристрою: окрема бібліотека з ліцензією MIT (див. BandFaceKit/LICENSE)
  BandFaceKit:
    path: BandFaceKit
targets:
  BandFace:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: BandFaceKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BandFace
        # Якщо мова iPhone не українська й не російська — показуємо англійську
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [uk, en, ru]
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "Bluetooth потрібен, щоб знайти пристрій Xiaomi та встановити циферблат."
        UILaunchScreen: {}
        # Анімації на 120 Гц на iPhone з ProMotion (без цього — не більше 60 к/с)
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bandface
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Менший застосунок: без символів налагодження й невикористаного коду, оптимізація під розмір
        Release:
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          COPY_PHASE_STRIP: YES
          SWIFT_OPTIMIZATION_LEVEL: -Osize
