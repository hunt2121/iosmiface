name: BandFace
options:
  bundleIdPrefix: com.example
  developmentLanguage: uk
  deploymentTarget:
    iOS: "16.0"
targets:
  BandFace:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BandFace
        # Якщо мова iPhone не українська й не російська — показуємо англійську
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [uk, en, ru]
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "Bluetooth потрібен, щоб знайти браслет Xiaomi та встановити циферблат."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bandface
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
