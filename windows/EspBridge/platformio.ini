; BandFace ESP32 bridge — BLE-міст до Xiaomi Smart Band для ПК без Bluetooth (експериментально).
; Збирається у двох варіантах:
;   esp32s3 — Waveshare ESP32-S3-Zero та інші ESP32-S3 (4 МБ flash, кольоровий світлодіод на GPIO21)
;   esp32c3 — ESP32-C3 Super Mini, ESP32-C3-DevKitM та подібні (4 МБ flash)
[env]
platform = espressif32@6.9.0
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 921600
lib_deps = h2zero/NimBLE-Arduino@1.4.3

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DBRIDGE_RGB_LED=21

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
