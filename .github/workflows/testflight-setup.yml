name: TestFlight setup

# Одноразове налаштування TestFlight через App Store Connect API (ті самі секрети, що й у TestFlight):
# внутрішня група «BandFace» з доступом до всіх збірок + усі користувачі команди App Store Connect у ній.
# Адреси користувачів у журнал не виводяться (репозиторій публічний).

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID застосунку"
        default: com.bandface.app
      group:
        description: "Назва внутрішньої групи"
        default: BandFace
      invite:
        description: "Надіслати листи-запрошення TestFlight тестерам групи"
        type: boolean
        default: false
      register:
        description: "Лише зареєструвати Bundle ID (до створення застосунку в App Store Connect)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - name: Configure TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.bandface.app' }}
          GROUP_NAME: ${{ inputs.group || 'BandFace' }}
          REGISTER_ONLY: ${{ inputs.register && '1' || '' }}
          SEND_INVITES: ${{ inputs.invite && '1' || '' }}
        run: python3 .github/scripts/testflight_setup.py
