name: Android

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Створити чернетку релізу з APK"
        type: boolean
        default: false
  push:
    branches: [android]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests
        working-directory: android
        run: gradle :bandfacekit:test --no-daemon
      - name: Build APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BandFace-android
          path: android/app/build/outputs/apk/release/*.apk
      - name: Draft release
        if: ${{ inputs.release || github.ref == 'refs/heads/android' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BandFace-android.apk
          gh release create "android-${{ github.run_number }}" BandFace-android.apk --draft --title "Android build ${{ github.run_number }}" --notes "Android APK" --target "${{ github.sha }}"
