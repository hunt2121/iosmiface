name: Android

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Створити чернетку релізу з APK"
        type: boolean
        default: false
  push:
    branches: [android]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests
        working-directory: android
        run: gradle :bandfacekit:test --no-daemon
      - name: Build APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log || { grep -E "^e: |error:" build.log | head -20 | sed 's/^/::error::/' ; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: BandFace-android
          path: android/app/build/outputs/apk/release/*.apk
      - name: Release
        if: ${{ inputs.release || github.ref == 'refs/heads/android' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk BandFace-android.apk
          VER="0.1.${{ github.run_number }}"
          if [[ "$MSG" == *"[release]"* ]]; then
            gh release create "android-v$VER" BandFace-android.apk --title "BandFace Android $VER" --notes "Android APK $VER" --target "${{ github.sha }}"
          else
            gh release create "android-$VER" BandFace-android.apk --draft --title "Android build $VER" --notes "Android APK" --target "${{ github.sha }}"
          fi
      - name: Mirror release to public repo
        if: ${{ contains(github.event.head_commit.message, '[release]') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: hunt2121/bandface
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "RELEASES_TOKEN не задано — пропуск"; exit 0; fi
          VER="0.1.${{ github.run_number }}"
          gh release create "android-v$VER" BandFace-android.apk --repo "$PUBLIC_REPO" \
            --title "BandFace Android $VER" --notes "Android APK $VER"
