name: Windows

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Створити чернетку релізу"
        type: boolean
        default: false
      app:
        description: "Що збирати"
        type: choice
        options: [bandface, creator, bridge]
        default: bandface
  push:
    branches: [windows]

permissions:
  contents: write

jobs:
  build:
    if: ${{ inputs.app != 'creator' && inputs.app != 'bridge' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests
        shell: bash
        working-directory: windows
        run: |
          dotnet test BandFace.Tests/BandFace.Tests.csproj -c Release 2>&1 | tee test.log || { grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Assert|Expected|Actual|Exception" test.log | sort -u | head -25 | sed 's/^/::error::/'; exit 1; }
      - name: Build
        shell: bash
        working-directory: windows
        run: |
          dotnet build BandFace/BandFace.csproj -c Release -p:Version=0.1.${{ github.run_number }} -o out 2>&1 | tee build.log || { grep -E "error [A-Z]+[0-9]+" build.log | sort -u | head -20 | sed 's/^/::error::/'; exit 1; }
          echo "--- out ---"
          ls -l out
          du -sk out
      - name: Screenshots
        if: ${{ contains(github.event.head_commit.message, '[shot]') }}
        shell: pwsh
        run: |
          function Shot($name, $page) {
            $p = Start-Process -FilePath "$PWD\windows\out\BandFace.exe" -ArgumentList "--page=$page","--shot=$PWD\$name.png" -PassThru
            $p.WaitForExit(30000) | Out-Null
            if (!$p.HasExited) { Stop-Process $p -Force } else { Write-Output "::error::exit $($p.ExitCode) for $name" }
          }
          $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item $k -Force | Out-Null
          Set-ItemProperty $k AppsUseLightTheme 1 -Type DWord
          Shot "light-faces" "faces"; Shot "light-key" "key"; Shot "light-log" "log"
          Set-ItemProperty $k AppsUseLightTheme 0 -Type DWord
          Shot "dark-faces" "faces"
          if (Test-Path "$env:TEMP\bandface-crash.txt") { Write-Output ("::error::" + ((Get-Content "$env:TEMP\bandface-crash.txt" -Raw) -replace "`r?`n"," | ").Substring(0,700)) }
          $info = (Get-ChildItem *.png,*.txt | ForEach-Object { "$($_.Name)=$($_.Length)" }) -join ", "
          Write-Output "::error::files: $info"
          foreach ($t in Get-ChildItem *.txt) { Write-Output ("::error::" + ((Get-Content $t -Raw) -replace "`r?`n"," | ").Substring(0,600)) }
          $miss = @("light-faces","light-key","light-log","dark-faces") | Where-Object { !(Test-Path "$_.png") }
          if ($miss) { exit 0 }
          gh release create "shots-${{ github.run_number }}" light-faces.png light-key.png light-log.png dark-faces.png --draft --title shots --notes shots
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Package
        shell: pwsh
        working-directory: windows
        run: |
          Compress-Archive -Path out\* -DestinationPath ..\BandFace-windows.zip -CompressionLevel Optimal
          (Get-Item ..\BandFace-windows.zip).Length
      - uses: actions/upload-artifact@v4
        with:
          name: BandFace-windows
          path: BandFace-windows.zip
      - name: Release
        if: ${{ inputs.release || github.ref == 'refs/heads/windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          VER="0.1.${{ github.run_number }}"
          if [[ "$MSG" == *"[release]"* ]]; then
            gh release create "windows-v$VER" BandFace-windows.zip --title "BandFace Windows $VER" --notes "Windows $VER" --target "${{ github.sha }}"
          else
            gh release create "windows-$VER" BandFace-windows.zip --draft --title "Windows build $VER" --notes "Windows" --target "${{ github.sha }}"
          fi

  # BandFace Creator — редактор циферблатів (лише ручний запуск з app=creator)
  creator:
    if: ${{ inputs.app == 'creator' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compiler tests
        continue-on-error: true
        shell: bash
        working-directory: windows
        run: |
          dotnet test FaceKit.Tests/FaceKit.Tests.csproj -c Release 2>&1 | tee test.log || { grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Assert|Expected|Actual|Exception" test.log | sort -u | head -25 | sed 's/^/::error::/'; exit 1; }
      - name: Build
        shell: bash
        working-directory: windows
        run: |
          dotnet build BandFaceCreator/BandFaceCreator.csproj -c Release -p:Version=0.1.${{ github.run_number }} -o creator 2>&1 | tee build.log || { grep -E "error [A-Z]+[0-9]+" build.log | sort -u | head -25 | sed 's/^/::error::/'; exit 1; }
          grep -E "warning CS" build.log | sort -u | head -15 | sed 's/^/::warning::/' || true
          ls -l creator
      - name: Screenshots
        shell: pwsh
        run: |
          function Shot($name, $arg) {
            $p = Start-Process -FilePath "$PWD\windows\creator\BandFaceCreator.exe" -ArgumentList $arg,"--shot=$PWD\$name.png" -PassThru
            $p.WaitForExit(40000) | Out-Null
            if (!$p.HasExited) { Stop-Process $p -Force; Write-Output "::warning::timeout $name" }
          }
          $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item $k -Force | Out-Null
          Set-ItemProperty $k AppsUseLightTheme 1 -Type DWord
          Shot "creator-light-editor" "--demo"; Shot "creator-light-faces" "--page=faces"; Shot "creator-light-fonts" "--page=fonts"
          Set-ItemProperty $k AppsUseLightTheme 0 -Type DWord
          Shot "creator-dark-editor" "--demo"; Shot "creator-dark-bin" "$PWD\windows\FaceKit.Tests\Faces\BigWatch_UA.bin"
          if (Test-Path "$env:TEMP\bandface-creator-crash.txt") { Write-Output ("::error::" + ((Get-Content "$env:TEMP\bandface-creator-crash.txt" -Raw) -replace "`r?`n"," | ")) }
          foreach ($t in Get-ChildItem *.png.txt) { Write-Output ("::error::" + ((Get-Content $t -Raw) -replace "`r?`n"," | ")) }
          $shots = Get-ChildItem creator-*.png | ForEach-Object { $_.Name }
          Write-Output "shots: $shots"
          if ($shots) { gh release create "creator-shots-${{ github.run_number }}" @shots --draft --title "Creator shots ${{ github.run_number }}" --notes shots }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Package
        shell: pwsh
        working-directory: windows
        run: |
          Compress-Archive -Path creator\* -DestinationPath ..\BandFaceCreator-windows.zip -CompressionLevel Optimal
          (Get-Item ..\BandFaceCreator-windows.zip).Length
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="0.1.${{ github.run_number }}"
          gh release create "creator-$VER" BandFaceCreator-windows.zip --draft --title "BandFace Creator $VER" --notes "BandFace Creator (Windows) $VER" --target "${{ github.sha }}"

  # Експериментально: прошивка ESP32-моста (лише ручний запуск з app=bridge)
  bridge:
    if: ${{ inputs.app == 'bridge' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: windows/EspBridge
        run: |
          pip install -q platformio==6.1.16
          pio run -e esp32s3 -e esp32c3
      - name: Merge
        working-directory: windows/EspBridge
        run: |
          PK=~/.platformio/packages
          for env in esp32s3 esp32c3; do
            B=.pio/build/$env
            python $PK/tool-esptoolpy/esptool.py --chip $env merge_bin -o ../../BandFaceBridge-$env.bin \
              --flash_mode keep --flash_freq keep --flash_size 4MB \
              0x0 $B/bootloader.bin 0x8000 $B/partitions.bin \
              0xe000 $PK/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 $B/firmware.bin
          done
          ls -l ../../BandFaceBridge-*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: BandFaceBridge
          path: BandFaceBridge-*.bin
      - name: Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "bridge-${{ github.run_number }}" BandFaceBridge-esp32s3.bin BandFaceBridge-esp32c3.bin --draft \
            --title "BandFace ESP32 bridge ${{ github.run_number }}" --notes "Експериментально: прошивка ESP32-S3 / ESP32-C3. Прошивати з адреси 0x0." --target "${{ github.sha }}"
