name: Windows

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Створити чернетку релізу"
        type: boolean
        default: false
      shots:
        description: "Зняти скріншоти вкладок"
        type: boolean
        default: false
  push:
    branches: [windows]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests
        shell: bash
        working-directory: windows
        run: |
          dotnet test BandFace.Tests/BandFace.Tests.csproj -c Release 2>&1 | tee test.log || { grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Assert|Expected|Actual|Exception" test.log | sort -u | head -25 | sed 's/^/::error::/'; exit 1; }
      - name: Face compiler tests
        continue-on-error: true
        shell: bash
        working-directory: windows
        run: |
          dotnet test FaceKit.Tests/FaceKit.Tests.csproj -c Release 2>&1 | tee facekit.log || { grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Assert|Expected|Actual" facekit.log | sort -u | head -25 | sed 's/^/::warning::/'; exit 1; }
      - name: Build
        shell: bash
        working-directory: windows
        run: |
          dotnet build BandFace/BandFace.csproj -c Release -p:Version=1.0.${{ github.run_number }} -o out 2>&1 | tee build.log || { grep -E "error [A-Z]+[0-9]+" build.log | sort -u | head -20 | sed 's/^/::error::/'; exit 1; }
          echo "--- out ---"
          ls -l out
          du -sk out
      - name: Screenshots
        if: ${{ inputs.shots || contains(github.event.head_commit.message, '[shot]') }}
        shell: pwsh
        run: |
          function Shot($name, $arg) {
            $p = Start-Process -FilePath "$PWD\windows\out\BandFace.exe" -ArgumentList $arg,"--shot=$PWD\$name.png" -PassThru
            $p.WaitForExit(40000) | Out-Null
            if (!$p.HasExited) { Stop-Process $p -Force } elseif ($p.ExitCode -ne 0) { Write-Output "::warning::exit $($p.ExitCode) for $name" }
          }
          $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item $k -Force | Out-Null
          Set-ItemProperty $k AppsUseLightTheme 1 -Type DWord
          $bin = "$PWD\windows\FaceKit.Tests\Faces\BigWatch_UA.bin"
          Shot "f4-light-face" "--face=$bin";
          Shot "1-light-faces" "--page=faces"; Shot "2-light-editor-list" "--page=editor"; Shot "3-light-editor" "--demo"
          Shot "4-light-settings" "--page=settings"; Shot "5-light-key" "--page=key"; Shot "6-light-fonts" "--page=fonts"
          Shot "a1-light-arc" "--demo=arc"; Shot "a2-light-line" "--demo=line"; Shot "a3-light-digits" "--demo=digits"
          Shot "a4-light-xml" "--demo=xml"; Shot "a5-light-images" "--demo=images"; Shot "a6-light-gallery" "--demo=gallery"; Shot "a7-light-gallery2" "--demo=gallery2"
          Set-ItemProperty $k AppsUseLightTheme 0 -Type DWord
          Shot "7-dark-faces" "--page=faces"; Shot "8-dark-editor" "--demo"; Shot "9-dark-settings" "--page=settings"
          $bin = "$PWD\windows\FaceKit.Tests\Faces\BigWatch_UA.bin"
          Shot "f1-dark-face" "--face=$bin"; Shot "f2-dark-done" "--face=$bin --demo-done"; Shot "f3-dark-progress" "--face=$bin --demo-progress"
          Shot "f5-dark-old" "--design=old --face=$bin"; Shot "f6-dark-editor-list" "--editor-list=$bin"; Shot "f7-dark-editor-list-old" "--design=old --editor-list=$bin"
          Shot "b1-dark-arc" "--demo=arc"; Shot "b2-dark-xml" "--demo=xml"; Shot "b3-dark-gallery" "--demo=gallery"
          if (Test-Path "$env:TEMP\bandface-crash.txt") { Write-Output ("::warning::" + ((Get-Content "$env:TEMP\bandface-crash.txt" -Raw) -replace "`r?`n"," | ").Substring(0,700)) }
          foreach ($t in Get-ChildItem *.txt) { Write-Output ("::warning::" + ((Get-Content $t -Raw) -replace "`r?`n"," | ")) }
          $shots = Get-ChildItem *.png | ForEach-Object { $_.Name }
          if ($shots) { gh release create "shots-${{ github.run_number }}" @shots --draft --title "Shots ${{ github.run_number }}" --notes shots }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Package
        shell: pwsh
        working-directory: windows
        run: |
          Compress-Archive -Path out\* -DestinationPath ..\BandFace-windows.zip -CompressionLevel Optimal
          (Get-Item ..\BandFace-windows.zip).Length
      - uses: actions/upload-artifact@v4
        with:
          name: BandFace-windows
          path: BandFace-windows.zip
      - name: Release
        if: ${{ inputs.release || github.ref == 'refs/heads/windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          VER="1.0.${{ github.run_number }}"
          if [[ "$MSG" == *"[release]"* ]]; then
            gh release create "windows-v$VER" BandFace-windows.zip --title "BandFace Windows $VER" --notes "Windows $VER" --target "${{ github.sha }}"
          else
            gh release create "windows-$VER" BandFace-windows.zip --draft --title "Windows build $VER" --notes "Windows" --target "${{ github.sha }}"
          fi
