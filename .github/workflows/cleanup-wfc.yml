name: Remove WatchfaceCompiler reference
# Одноразове прибирання: гілка з exe, її workflow і чернетки з еталонними результатами.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch, drafts and tags
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          gh api -X DELETE "repos/$R/git/refs/heads/wfc-reference" && echo "branch deleted" || echo "no branch"
          for id in $(gh api "repos/$R/releases" --paginate --jq '.[] | select(.name=="wfc reference output" or .name=="wfc swift output" or .name=="editor test output") | .id'); do
            gh api -X DELETE "repos/$R/releases/$id" && echo "release $id deleted"
          done
          for t in $(gh api "repos/$R/git/matching-refs/tags/wfc-" --jq '.[].ref' ; gh api "repos/$R/git/matching-refs/tags/editor-test-" --jq '.[].ref'); do
            gh api -X DELETE "repos/$R/git/$t" && echo "$t deleted"
          done
