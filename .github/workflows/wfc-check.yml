name: FaceCompiler check
# Звірка Swift-порту компілятора циферблатів з еталонним виходом exe. Лише вручну, одна машина.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          swift --version
      - name: Build wfc
        run: |
          set -o pipefail
          swift build -c release --package-path BandFaceKit --product wfc 2>&1 | tee build.log | tail -30
      - name: Reference inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.name=="wfc reference output") | .assets[0].id' | head -1)
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ID" > ref.zip
          unzip -q ref.zip -d ref && ls ref
      - name: Unpack and build every face
        run: bash BandFaceKit/Tools/check_wfc.sh
      - name: Unit tests
        continue-on-error: true
        run: swift test --package-path BandFaceKit --filter FaceCompilerTests 2>&1 | tail -40 | tee swift/logs/tests.txt
      - name: Publish results as a draft release asset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p swift && cp build.log swift/ 2>/dev/null || true
          zip -qr wfc-swift.zip swift
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.name=="wfc swift output") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "wfc-swift-$GITHUB_RUN_NUMBER" wfc-swift.zip --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "wfc swift output" --notes "temporary"
