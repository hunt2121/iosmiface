name: Fetch MiSans
# Разово: шрифт MiSans для показу написів у редакторі. Linux-машина (не займає macOS).
# Підмножина: латиниця, кирилиця, цифри й знаки — 10 насичень, як у браслета. Результат — у чернетку релізу.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get package
        run: |
          npm pack misans@3.0.2 >/dev/null
          tar xzf misans-*.tgz
          find package -type f | sed 's/^/  /' > listing.txt
          du -sh package >> listing.txt
          head -80 listing.txt
      - name: Inspect and subset
        run: |
          pip install --quiet fonttools brotli
          cat > sub.py <<'PY'
          import os, glob, re, sys
          from fontTools.ttLib import TTFont
          from fontTools import subset
          files = [f for f in glob.glob('package/**/*', recursive=True) if f.lower().endswith(('.ttf','.otf','.woff2','.woff'))]
          print(len(files), 'font files')
          need = [0x41, 0x61, 0x30, 0x410, 0x456, 0x491, 0x404]   # A a 0 А і ґ Є
          info = []
          for f in sorted(files):
              try:
                  t = TTFont(f, lazy=True); cm = t.getBestCmap() or {}
                  nm = t['name'].getDebugName(4) or ''
                  cov = ''.join('+' if c in cm else '-' for c in need)
                  info.append((f, nm, len(cm), cov, os.path.getsize(f)))
              except Exception as e:
                  info.append((f, 'ERR ' + str(e)[:40], 0, '', os.path.getsize(f)))
          with open('report.txt', 'w') as r:
              for i in info: r.write('%s | %s | %d glyphs | %s | %d bytes\n' % i)
          print(open('report.txt').read()[:6000])
          PY
          python3 sub.py
          # латиниця MiSans (кирилиці в MiSans немає — її браслет і iOS беруть з іншого шрифту): 10 насичень у TTF
          cat > conv.py <<'PY'
          import glob, os
          from fontTools.ttLib import TTFont
          os.makedirs('out', exist_ok=True)
          for f in glob.glob('package/lib/*.119.woff2'):
              t = TTFont(f)
              ps = t['name'].getDebugName(6) or os.path.basename(f)
              t.flavor = None
              t.save(os.path.join('out', ps + '.ttf'))
              print(ps, os.path.getsize(os.path.join('out', ps + '.ttf')))
          PY
          python3 conv.py
          cp package/LICENSE* out/ 2>/dev/null || true
          ls -la out
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -q fonts-report.zip listing.txt report.txt out/* || true
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.name=="fonts output") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "fonts-${{ github.run_number }}" fonts-report.zip --draft --repo "$GITHUB_REPOSITORY" --title "fonts output" --notes "temporary"
