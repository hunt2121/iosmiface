name: Test editor
# Тести редактора циферблатів і BandFace на симуляторі зі знімками екранів. Лише вручну, одна машина.
# IPA BandFace збирає build.yml.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_NUM: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      # Тести на симуляторі: логіка редактора, прохід екранами редактора і BandFace (зі знімками)
      - name: Test on simulator
        continue-on-error: true
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator $DEV"
          mkdir -p test-out
          for SCHEME in FaceEditor BandFace; do
            TEST_RUNNER_SHOTS="$PWD/test-out" xcodebuild test -project BandFace.xcodeproj -scheme $SCHEME \
              -destination "id=$DEV" -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-out/test-$SCHEME.log | \
              grep -E "error:|failed|passed|Test Suite|Executed" | head -60
          done
      - name: Publish test output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-out && zip -qr editor-test.zip test-out
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.name=="editor test output") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "editor-test-$BUILD_NUM" editor-test.zip --draft --target "$GITHUB_SHA" --title "editor test output" --notes "temporary"
