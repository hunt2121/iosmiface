name: Test editor
# Тести редактора циферблатів на симуляторі. Лише вручну й лише коли справді потрібно, одна машина.
# За замовчуванням — тільки швидкі тести логіки (компілятор, редактор, превʼю).
# ui: true — ще й прохід екранами BandFace зі знімками. IPA збирає build.yml.
on:
  workflow_dispatch:
    inputs:
      ui:
        description: "Прохід екранами зі знімками"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      BUILD_NUM: ${{ github.run_number }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      # -O: тести компілятора (PNG, RLE) у неоптимізованій збірці йдуть у рази довше
      - name: Test on simulator
        id: test
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          ONLY="-only-testing:EditorTests"
          if [ "${{ inputs.ui }}" = "true" ]; then ONLY="$ONLY -only-testing:BandFaceUITests"; fi
          mkdir -p test-out
          set -o pipefail
          TEST_RUNNER_SHOTS="$PWD/test-out" xcodebuild test -project BandFace.xcodeproj -scheme BandFace \
            -destination "id=$DEV" -derivedDataPath build-sim $ONLY -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-O COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | \
            tee test-out/test.log | grep -E "error:|failed|Executed|\*\* TEST" | head -60
      # Знімки й журнал — лише для проходу екранами або коли тести впали
      - name: Publish test output
        if: always() && (inputs.ui || steps.test.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-out && zip -qr editor-test.zip test-out
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.name=="editor test output") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "editor-test-$BUILD_NUM" editor-test.zip --draft --target "$GITHUB_SHA" --title "editor test output" --notes "temporary"
