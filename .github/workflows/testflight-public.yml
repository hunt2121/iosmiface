name: TestFlight public

# Публічне посилання TestFlight: інформація для тестування, зовнішня група «Public»,
# найновіша збірка — в групу й на перевірку Apple. Запускається сам після кожної вдалої збірки TestFlight
# (чекає, поки Apple обробить збірку) або вручну.
# Секрети, крім ключа API: TF_CONTACT_FIRST_NAME, TF_CONTACT_LAST_NAME, TF_CONTACT_PHONE, TF_CONTACT_EMAIL
# (контакти для перевірки Apple і адреса для відгуків тестерів; у журнал не виводяться).

on:
  workflow_dispatch:
  workflow_run:
    workflows: [TestFlight]
    types: [completed]

permissions:
  contents: read

jobs:
  public:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - name: Public TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TF_CONTACT_FIRST_NAME: ${{ secrets.TF_CONTACT_FIRST_NAME }}
          TF_CONTACT_LAST_NAME: ${{ secrets.TF_CONTACT_LAST_NAME }}
          TF_CONTACT_PHONE: ${{ secrets.TF_CONTACT_PHONE }}
          TF_CONTACT_EMAIL: ${{ secrets.TF_CONTACT_EMAIL }}
          BUNDLE_ID: com.bandface.app
        run: python3 .github/scripts/testflight_public.py
