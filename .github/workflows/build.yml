name: Build IPA

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Опублікувати IPA як GitHub Release"
        type: boolean
        default: false
      sign:
        description: "Підписати IPA власним сертифікатом (секрети IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64) і покласти в чернетку релізу"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      BUILD_NUM: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # Найновіший Xcode 26 (iOS 26 SDK) — потрібен для нижнього меню в стилі Liquid Glass
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      # Тести протоколу (BandFaceKit) на імітації браслета; падіння не зупиняє збірку IPA
      - name: Test BandFaceKit
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --package-path BandFaceKit 2>&1 | tee test.log || {
            # Помилки тестів — в анотації, щоб їх було видно без завантаження журналу
            grep -E "error:|failed|XCTAssert" test.log | head -10 | while IFS= read -r line; do
              echo "::warning title=BandFaceKit tests::$line"
            done
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BandFace.xcodeproj \
            -scheme BandFace \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            build

      # Назва як версія внизу журналу («BandFace v1.0.43»), але без точок: BandFace-v1043
      - name: Package IPA
        run: |
          VERSION=$(grep -E 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          NAME="BandFace-v$(echo "${VERSION}.${BUILD_NUM}" | tr -d '.')"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BandFace.app Payload/
          zip -r "$NAME.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}.ipa

      # Ручний запуск з sign=true: підпис рідним codesign сертифікатом і профілем із секретів.
      # Підписаний IPA лягає в ЧЕРНЕТКУ релізу signed-<N> (не видна без входу); після завантаження її видаляють.
      - name: Sign IPA
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Немає секретів IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          BUNDLE="${APPID#*.}"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | awk '{print $2}')
          echo "Bundle: $BUNDLE, team: $TEAM"

          rm -rf signing && mkdir signing && cd signing
          unzip -q "../$IPA_NAME.ipa"
          APP=Payload/BandFace.app
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE" "$APP/Info.plist"
          cat > ent.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>application-identifier</key><string>$APPID</string>
          <key>com.apple.developer.team-identifier</key><string>$TEAM</string>
          <key>keychain-access-groups</key><array><string>$APPID</string></array>
          <key>get-task-allow</key><false/>
          </dict></plist>
          EOF
          codesign --force --sign "$IDENTITY" --entitlements ent.plist --keychain "$KEYCHAIN" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          zip -qr "../$IPA_NAME-signed.ipa" Payload
          cd ..
          gh release create "signed-$BUILD_NUM" "$IPA_NAME-signed.ipa" --draft \
            --target "$GITHUB_SHA" --title "Signed $IPA_NAME" --notes "Temporary signed build"
          security delete-keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision"

      # Ручний запуск з release=true: IPA стає Release з тегом версії (v1.0.N) —
      # посилання …/releases/latest відкривається без входу в GitHub і не видаляється за 90 днів
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(grep -E 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([^"]+)".*/\1/').${BUILD_NUM}"
          gh release create "$TAG" "$IPA_NAME.ipa" \
            --target "$GITHUB_SHA" \
            --title "BandFace $TAG" \
            --notes "Unsigned IPA for sideloading (Sideloadly / AltStore). See README for installation."
