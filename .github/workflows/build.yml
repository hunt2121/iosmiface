name: Build IPA

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Опублікувати IPA як GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      BUILD_NUM: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # Найновіший Xcode 26 (iOS 26 SDK) — потрібен для нижнього меню в стилі Liquid Glass
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      # Тести протоколу (BandFaceKit) на імітації браслета; падіння не зупиняє збірку IPA
      - name: Test BandFaceKit
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --package-path BandFaceKit 2>&1 | tee test.log || {
            # Помилки тестів — в анотації, щоб їх було видно без завантаження журналу
            grep -E "error:|failed|XCTAssert" test.log | head -10 | while IFS= read -r line; do
              echo "::warning title=BandFaceKit tests::$line"
            done
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BandFace.xcodeproj \
            -scheme BandFace \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            build

      # Назва як версія внизу журналу («BandFace v1.0.43»), але без точок: BandFace-v1043
      - name: Package IPA
        run: |
          VERSION=$(grep -E 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          NAME="BandFace-v$(echo "${VERSION}.${BUILD_NUM}" | tr -d '.')"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BandFace.app Payload/
          zip -r "$NAME.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}.ipa

      # Ручний запуск з release=true: IPA стає Release з тегом версії (v1.0.N) —
      # посилання …/releases/latest відкривається без входу в GitHub і не видаляється за 90 днів
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(grep -E 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([^"]+)".*/\1/').${BUILD_NUM}"
          gh release create "$TAG" "$IPA_NAME.ipa" \
            --target "$GITHUB_SHA" \
            --title "BandFace $TAG" \
            --notes "Unsigned IPA for sideloading (Sideloadly / AltStore). See README for installation."

      # Дзеркало в публічний репозиторій з готовими збірками (потрібен секрет RELEASES_TOKEN)
      - name: Mirror release to public repo
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: hunt2121/bandface
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "RELEASES_TOKEN не задано — пропуск"; exit 0; fi
          TAG="v$(grep -E 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([^"]+)".*/\1/').${BUILD_NUM}"
          gh release create "ios-$TAG" "$IPA_NAME.ipa" --repo "$PUBLIC_REPO" \
            --title "BandFace iOS $TAG" \
            --notes "Unsigned IPA for sideloading (iloader / Sideloadly / AltStore). See README for installation."
