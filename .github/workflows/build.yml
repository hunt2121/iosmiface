name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      BUILD_NUM: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # Найновіший Xcode 26 (iOS 26 SDK) — потрібен для нижнього меню в стилі Liquid Glass
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      # Тести протоколу (BandFaceKit) на імітації браслета; падіння не зупиняє збірку IPA
      - name: Test BandFaceKit
        continue-on-error: true
        run: swift test --package-path BandFaceKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BandFace.xcodeproj \
            -scheme BandFace \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BandFace.app Payload/
          zip -r "BandFace-build${BUILD_NUM}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BandFace-build${{ github.run_number }}
          path: BandFace-build${{ github.run_number }}.ipa
